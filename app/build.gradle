plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.sevimli.tzd'
    compileSdk 34

    defaultConfig {
        applicationId "uz.sevimli.tzd"
        minSdk 21
        targetSdk 34
        versionCode 68
        versionName "6.8"
    }

    signingConfigs {
        release {
            def kf = System.getenv("KEYSTORE_FILE")
            if (kf != null && !kf.isEmpty()) {
                storeFile file(kf)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // KOD TOZALASH (R8) — yoqilgan, lekin NOM O'ZGARTIRISH O'CHIQ.
            //
            // proguard-rules.pro ichida `-dontobfuscate` turibdi. Ya'ni
            // ishlatilmaydigan kod olib tashlanadi (APK kichrayadi, majburiy
            // yangilanish ombor Wi-Fi'sida tezroq yuklanadi), lekin sinf
            // nomlari o'zgarmaydi — refleksiyaga tayanadigan joylar
            // (androidx.security/Tink, Activity'lar, ViewBinding) buzilmaydi
            // va xato hisobotlari o'qiladigan bo'lib qoladi.
            //
            // Resurs tozalash ham yoqilgan. Buning uchun ikonkalar ish paytida
            // NOM bo'yicha qidirilmaydigan qilib o'zgartirildi (MenuFunctions.kt) —
            // aks holda R8 ularni ishlatilmaydi deb olib tashlar edi.
            // Xavfsizlik auditi uchun ANIQ yozib qo'yamiz. Release build'i
            // default bo'yicha ham debug rejimida emas, lekin buni kod ichida
            // ko'rinadigan qilish auditorning birinchi savoliga javob beradi.
            debuggable false

            // KOD TOZALASH (R8) O'CHIRILDI — v6.4 da qaytarildi.
            //
            // SABAB: v6.1 da uni yoqqan edik (APK kichrayadi, majburiy
            // yangilanish ombor Wi-Fi'sida tezroq yuklanadi). Lekin
            // amalda Google Play Protect yangi APK'ni "Вредоносное
            // приложение заблокировано" deb BLOKLAB qo'ydi va har bir
            // terminalda qo'lda "Baribir o'rnatish" bosishga majbur qildi.
            //
            // Play Protect uchun eng shubhali kombinatsiya shu:
            //   Play Store'dan tashqarida tarqatilgan APK
            //   + kodi siqilgan (minify)
            //   + ilova o'zi APK o'rnata oladi (REQUEST_INSTALL_PACKAGES)
            //
            // v5.8 da `minifyEnabled false` edi va hech qanday ogohlantirish
            // chiqmasdi. Ya'ni farq aynan shu yerda.
            //
            // NIMA YO'QOTAMIZ: APK biroz kattaroq bo'ladi (ishlatilmaydigan
            // kod olib tashlanmaydi). Ishlash tezligiga, funksiyalarga va
            // xavfsizlikka TA'SIRI YO'Q — `-dontobfuscate` tufayli R8
            // baribir nom o'zgartirmayotgan edi.
            //
            // NIMA YUTAMIZ: parkdagi har terminal yangilanishni jimgina
            // qabul qiladi.
            minifyEnabled false
            shrinkResources false
            // ATAYLAB `proguard-android.txt` — "optimize" varianti EMAS.
            // Optimize varianti `-allowaccessmodification` va qo'shimcha
            // optimizatsiya bosqichlarini yoqadi; ular `-dontobfuscate` bilan
            // birga kutilmagan holat berishi mumkin. Bizga kerak bo'lgan
            // asosiy foyda — ISHLATILMAYDIGAN kodni olib tashlash — ikkala
            // variantda ham bir xil. Terminalda sinab ko'rilgandan keyin
            // xohlasangiz "optimize" ga o'tish mumkin.
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'

            // Xavfsizlik: RELEASE build'i faqat haqiqiy release imzo kaliti bilan
            // chiqishi shart. Agar KEYSTORE_FILE env yo'q bo'lsa va aynan release
            // assembly task ishga tushirilayotgan bo'lsa — build'ni to'xtatamiz
            // (debug kalit bilan "release" APK chiqarib qo'ymaslik uchun).
            // Debug build'lar (assembleDebug) bunga umuman ta'sirlanmaydi.
            def hasKeystore = System.getenv("KEYSTORE_FILE") ? true : false
            def isReleaseAssembly = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("release")
            }
            if (isReleaseAssembly && !hasKeystore) {
                throw new GradleException(
                    "RELEASE build bloklandi: release keystore topilmadi. " +
                    "KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD " +
                    "env o'zgaruvchilarini o'rnating. Debug kalit bilan release APK chiqarishga yo'l qo'yilmaydi."
                )
            }

            // CI'da imzo kaliti bo'lsa — release imzo bilan, aks holda (mahalliy) debug imzo bilan.
            // (Yuqoridagi guard release assembly'da debug'ga tushib qolishning oldini oladi.)
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    // Uzun ro'yxatlar uchun (hujjat qatorlari) — faqat ko'rinadigan
    // qatorlarni chizadi va surilganda ularni qayta ishlatadi.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // @DrawableRes va boshqa annotatsiyalar (tranzitiv keladi, lekin
    // to'g'ridan-to'g'ri ishlatganimiz uchun ochiq yozilgan)
    implementation 'androidx.annotation:annotation:1.8.2'
    // Token-at-rest shifrlash (EncryptedSharedPreferences)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
